<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا - سياحة السودان</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        nav {
            background-color: #007bff;
            padding: 15px;
            color: white;
            text-align: center;
        }
        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .contact-container {
            max-width: 500px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #007bff;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-submit {
            background-color: #f39c12;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .btn-submit:hover {
            background-color: #e67e22;
        }
    </style>
</head>
<body>

    <!-- شريط التنقل العلوي -->
    <nav>
        <h2>سياحة السودان</h2>
        <ul>
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="places.html">الاماكن السياحية</a></li>
            <li><a href="contact.html">اتصل بنا</a></li>
        </ul>
    </nav>

    <!-- نموذج الاتصال -->
    <div class="contact-container">
        <h2>تواصل معنا</h2>
        <form action="" method="POST">
            <div class="form-group">
                <label>الاسم</label>
                <input type="text" placeholder="أدخل اسمك" required>
            </div>

            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" placeholder="أدخل بريدك الإلكتروني" required>
            </div>

            <div class="form-group">
                <label>الرسالة</label>
                <textarea placeholder="اكتب رسالتك..." rows="5" required></textarea>
            </div>

            <div>
                <button type="submit" class="btn-submit">إرسال</button>
            </div>
        </form>
    </div>

</body>
</html>
