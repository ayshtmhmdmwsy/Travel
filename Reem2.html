<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفحة الرئيسية - سياحة السودان</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <h2>سياحة السودان</h2>
    <ul>
        <li><a href="home.html">الرئيسية</a></li>
        <li><a href="places.html">الاماكن السياحية</a></li>
        <li><a href="contact.html">اتصل بنا</a></li>
        <li><a href="#" onclick="logout()">تسجيل الخروج</a></li>
    </ul>
</nav>
<div class="contact-form-container" style="max-width: 500px; margin: 30px auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <form action="" method="POST">
        <div style="margin-bottom: 15px; text-align: right;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #333;">الاسم</label>
            <input type="text" placeholder="أدخل اسمك" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 15px; text-align: right;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #333;">البريد الإلكتروني</label>
            <input type="email" placeholder="أدخل بريدك الإلكتروني" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 15px; text-align: right;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #333;">الرسالة</label>
            <textarea placeholder="اكتب رسالتك..." rows="4" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;"></textarea>
        </div>

        <div style="text-align: center;">
            <button type="submit" style="background-color: #f39c12; color: white; border: none; padding: 10px 30px; font-size: 16px; border-radius: 20px; cursor: pointer; font-weight: bold;">إرسال</button>
        </div>
    </form>
</div>


<header class="hero">
    <h1>مرحبا بك في ارض النيلين</h1>
    <p>من اهرامات مروي الى شواطئ البحر الاحمر</p>
    <a href="places.html" class="btn">ابدأ الاستكشاف</a>
</header>

<section class="cards">
    <div class="card">
        <h3>اهرامات مروي</h3>
        <p>تاريخ 3000 سنة في قلب الصحراء</p>
    </div>
    <div class="card">
        <h3>البحر الاحمر</h3>
        <p>شعاب مرجانية وغوص لا مثيل له</p>
    </div>
    <div class="card">
        <h3>جبل مرة</h3>
        <p>طبيعة خضراء ومناخ معتدل</p>
    </div>
</section>

<script src="script.js"></script>
<script>checkLogin()</script>
</body>
</html>
